<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Waveform Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="notebook">
        <div class="notebook-header">
            <h1>Waveform Parameters</h1>
        </div>
        
        <div class="canvas-container">
            <canvas id="waveCanvas"></canvas>
        </div>
        
        <div class="controls">
            <label for="speedSlider">Transition Speed:</label>
            <input type="range" id="speedSlider" min="0.01" max="0.15" step="0.01" value="0.05">
            <span id="speedDisplay">0.05</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
